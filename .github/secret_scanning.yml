# Secret scanning / push protection exclusions.
#
# .claude/skills/** is excluded wholesale: these are Claude Code skill docs,
# not application code, and the tool-readiness skill in particular documents
# secret-scanning technique using intentional canary values (realistic-looking
# fake keys, e.g. `sk_live_51QwErTyUiOpAsDfGhJkLzXcV`) that must resemble real
# credentials closely enough to trip a scanner's rules — that is the entire
# point of a canary fixture. None of these are real credentials.
#
# .gitleaks.toml is excluded for the same reason: it carries the same canary
# value in a comment and in its own `[[allowlists]]` entry ("Canary fixture
# used to prove the scanner still fires").
paths-ignore:
  - ".claude/skills/**"
  - ".gitleaks.toml"
