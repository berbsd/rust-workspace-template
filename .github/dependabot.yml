# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automated dependency updates for Cargo and GitHub Actions.
# Documentation: https://docs.github.com/en/code-security/dependabot
#
# Dependabot will open PRs for dependency updates on the configured schedule.
# Minor and patch updates are grouped into a single PR to reduce noise.
# Commit messages use conventional commit format for compatibility with
# cogitto and git-cliff.
# =============================================================================

version: 2

updates:
  # ── Rust (Cargo) Dependencies ──────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
