# =============================================================================
# Workspace Configuration
# =============================================================================
# This is the root Cargo.toml for the workspace. It defines:
# - Which crates belong to the workspace (members)
# - Shared package metadata (workspace.package)
# - Shared lint configuration (workspace.lints)
# - Shared dependencies with centralized version management (workspace.dependencies)
#
# To add a new crate:
#   1. Create the crate in crates/ (workspace-wide library), services/ (a
#      service: schema + `router(pool)` + standalone binary — see
#      services/example), hosts/ (binaries composing multiple services'
#      routers — wiring only, no domain logic), jobs/ (a one-off run — an
#      import, a backfill, a migration), or workers/ (ongoing work with no
#      HTTP surface, triggered on demand and/or on a schedule). `jobs/` and
#      `workers/` have no glob below until the first one is added — a members
#      glob whose directory doesn't exist fails the whole workspace.
#   2. It will be auto-discovered via the glob patterns below.
#
# To add a new dependency:
#   1. Add it to [workspace.dependencies] with version
#   2. Reference it in the crate's Cargo.toml: `dep = { workspace = true }`
# =============================================================================

[workspace]
members  = ["crates/*", "hosts/*", "services/*"]
resolver = "3"

[workspace.package]
authors     = ["{{AUTHOR_NAME}} <{{AUTHOR_EMAIL}}>"]
categories  = ["microservices"]
description = "{{PROJECT_NAME}} — Rust microservices workspace"
edition     = "2024"
keywords    = ["microservices", "platform", "rust"]
license     = "{{LICENSE}}"
publish     = false
readme      = "README.md"
repository  = "{{REPO_URL}}"
version     = "0.1.3"

[workspace.metadata]

# =============================================================================
# Lint Configuration
# =============================================================================
# These lints apply to all crates that specify `[lints] workspace = true`.
#
# Lint levels: "allow" < "warn" < "deny" < "forbid"
# Priority: Higher priority = applied later (overrides lower priority)
#
# To allow a lint in a specific crate, add to that crate's Cargo.toml:
#   [lints.clippy]
#   lint_name = "allow"
# =============================================================================

[workspace.lints.rust]
deprecated = "allow"

# Safety & Correctness
missing_unsafe_on_extern = "deny"
unsafe_code              = "warn"
unsafe_op_in_unsafe_fn   = "deny"

# Code Quality
dead_code = "warn"

unreachable_patterns = "deny"
unused_imports       = "warn"
unused_must_use      = "deny"
unused_variables     = "warn"

# Performance
trivial_casts         = "warn"
trivial_numeric_casts = "warn"

# API Quality
unnameable_types = "warn"

# Bug Prevention
unit_bindings = "warn"

double_negations     = "warn"
let_underscore_drop  = "warn"
single_use_lifetimes = "warn"
unreachable_pub      = "warn" # forces honest pub vs pub(crate)
unused_lifetimes     = "warn"
unused_macro_rules   = "warn"

[workspace.lints.clippy]
# Baseline
all        = { level = "deny", priority = 1 }
complexity = { level = "warn", priority = 2 }
pedantic   = { level = "warn", priority = 2 }
style      = { level = "warn", priority = 2 }

# Allow workspace metadata warnings
cargo_common_metadata = { level = "allow", priority = 3 }

# The banned calls themselves are listed in `.clippy.toml`. Priority 3 rather
# than a bare `= "deny"`: this lint belongs to the `style` group, bare entries
# carry priority 0, and Cargo applies lints in ascending priority order with
# later flags winning — so at 0 the `style = "warn"` above would quietly demote
# it back to a warning.
disallowed_methods = { level = "deny", priority = 3 }

# === Critical Safety (No Panics) ===
# `indexing_slicing` catches the one panic source the rest of this block
# misses: `v[i]` / `&s[a..b]` panic out-of-range without naming a macro, so
# `panic`/`unwrap_used`/`expect_used` never see them. Prefer `.get()`.
# `warn` not `deny` because the `#![cfg_attr(test, allow(...))]` blocks omit
# this lint; raise it once those are widened.
expect_used      = "deny"
indexing_slicing = "warn"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
unwrap_used      = "deny"

# === Correctness ===
absurd_extreme_comparisons = "deny"
almost_swapped             = "deny"
bad_bit_mask               = "deny"
cast_slice_different_sizes = "deny"
char_lit_as_u8             = "deny"

# === Async Safety (CRITICAL) ===
async_yields_async        = "warn"
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"

# === Async / concurrency
mutex_atomic                  = "warn"
mutex_integer                 = "warn"
rc_buffer                     = "warn"
rc_mutex                      = "warn" # nearly always wrong (want Arc<Mutex>)
significant_drop_in_scrutinee = "warn"
significant_drop_tightening   = "warn" # holding MutexGuard across await

# === Suspicious Patterns ===
arc_with_non_send_sync = "warn"
cast_abs_to_unsigned   = "warn"
cast_nan_to_int        = "warn"
float_cmp              = "warn"

# === Performance ===
box_collection                    = "warn"
bytes_count_to_len                = "warn"
clone_on_copy                     = "warn"
cmp_owned                         = "warn"
inefficient_to_string             = "warn"
items_after_statements            = "warn"
large_stack_arrays                = "warn"
large_types_passed_by_value       = "warn"
manual_memcpy                     = "warn"
needless_borrows_for_generic_args = "warn"
needless_collect                  = "warn"
needless_pass_by_value            = "warn"
or_fun_call                       = "warn"
redundant_clone                   = "warn"
stable_sort_primitive             = "warn"
trivially_copy_pass_by_ref        = "warn"
unnecessary_to_owned              = "warn" # natural complement to redundant_clone
unnecessary_wraps                 = "warn"
useless_conversion                = "warn"

# === Path / Import Style ===
enum_glob_use                 = "warn" # forbid `use MyEnum::*;` (pedantic)
semicolon_if_nothing_returned = "warn" # statement hygiene (pedantic)
single_component_path_imports = "warn" # forbid `use foo;` for a sibling (style)
unnecessary_self_imports      = "warn" # forbid `use foo::{self};` (pedantic)
wildcard_imports              = "warn" # forbid `use foo::*;` (pedantic)

# === String/Format ===
format_in_format_args    = "warn"
to_string_in_format_args = "warn"

# === Error Handling ===
map_err_ignore   = "warn"
result_large_err = "warn"

# === Iterator/loop mistakes
debug_assert_with_mut_call = "warn"
iter_over_hash_type        = "warn" # non-determinism source
mem_forget                 = "deny" # almost always a bug
mem_replace_with_default   = "warn"

# === Comparison/logic bugs
bool_comparison                = "warn"
nonminimal_bool                = "warn"
suspicious_operation_groupings = "warn"

# === Lifetime / borrow footguns
imprecise_flops     = "warn"
lossy_float_literal = "warn"
suboptimal_flops    = "warn"

# === API / Hygiene
dbg_macro                         = "deny"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets       = "warn"
exit                              = "deny" # only `main` should exit
let_underscore_future             = "deny" # silently dropping a Future = bug
let_underscore_must_use           = "warn"
print_stderr                      = "warn"
print_stdout                      = "warn" # forces tracing
return_self_not_must_use          = "warn"

# === Integer Safety ===
cast_possible_truncation = "warn"
cast_possible_wrap       = "warn"
cast_precision_loss      = "warn"
cast_sign_loss           = "warn"

# === Pragmatic Allows ===
collapsible_if            = { level = "allow", priority = 3 }
duration_suboptimal_units = { level = "allow", priority = 3 }
ignore_without_reason     = { level = "allow", priority = 3 }
missing_errors_doc        = { level = "allow", priority = 3 }
module_name_repetitions   = { level = "allow", priority = 3 }
must_use_candidate        = { level = "allow", priority = 3 }
similar_names             = { level = "allow", priority = 3 }
single_match_else         = { level = "allow", priority = 3 }
struct_field_names        = { level = "allow", priority = 3 }
too_many_arguments        = { level = "allow", priority = 3 }
too_many_lines            = { level = "allow", priority = 3 }
uninlined_format_args     = { level = "allow", priority = 3 }

# =============================================================================
# Workspace Dependencies
# =============================================================================
# Every external dependency is declared here once; crates reference it with
# `dep = { workspace = true, features = [...] }` and never pin their own
# version. Always full semver (x.y.z).
#
# To update: change the version here, `cargo update`, then `just check`.
# =============================================================================

[workspace.dependencies]

# --- internal crates --------------------------------------------------------
# Every internal crate is declared here once; members inherit with
# `{ workspace = true, features = [...] }`. These entries are the single
# record of where a crate lives — moving a crate edits its line here only.

common-types = { path = "crates/common-types" }
example      = { path = "services/example" }

# --- external crates --------------------------------------------------------

async-trait        = "0.1.92"
axum               = "0.8.9"
base64             = "0.23.1"
chrono             = "0.4.45"
garde              = "0.23.0"
serde              = "1.0.229"
serde_json         = "1.0.151"
sqlx               = "0.9.0"
thiserror          = "2.0.20"
tokio              = "1.53.1"
tracing            = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa             = "5.5.0"
uuid               = "1.26.1"

# =============================================================================
# Dev Dependencies (Testing)
# =============================================================================
tower = "0.5.3"

# =============================================================================
# Profile Overrides
# =============================================================================
# --- Dev ---------------------------------------------------------------------
# `line-tables-only` keeps what a backtrace actually reads — file, line,
# function — and drops the variable/type descriptions a debugger would use.
# Dependencies get nothing: a frame inside a third-party crate is not one
# anybody here steps through, and their symbols are the bulk of the weight.
# Reach for `debug = 2` again the day you genuinely need to inspect locals in
# a dependency, rather than carrying the cost of that day on every build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# --- Release ----------------------------------------------------------------
[profile.release]
# Deliberately NOT `panic = "abort"`. A host binary composes multiple
# services in one process (see hosts/), and `abort` would turn one panicking
# request into a crash loop for everything sharing that process — the
# default `unwind` keeps a panic inside the task/connection that hit it, so
# tokio's per-task catch turns it into one failed request rather than a
# whole-process crash.
strip = "symbols"
