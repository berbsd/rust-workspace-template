id: no-skipped-tests
valid:
  - |
    #[test]
    fn test_widget_create() {
        assert_eq!(1, 1);
    }
  - |
    /// This test used to carry `#[ignore]` before it was converted to
    /// `#[sqlx::test]`.
    #[sqlx::test(migrations = "./migrations")]
    async fn test_widget_persists(pool: PgPool) {
        assert!(true);
    }
  - |
    /// ```no_run
    /// let client = Client::new("live-key");
    /// client.call();
    /// ```
    pub fn call_live_api() {}
invalid:
  - |
    #[ignore]
    #[test]
    fn test_flaky_thing() {
        assert_eq!(1, 1);
    }
  - |
    #[test]
    #[ignore = "requires TEST_DATABASE_URL"]
    fn test_widget_create() {
        assert_eq!(1, 1);
    }
