# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-silent-env-skip
language: Rust
severity: error
message: >-
  An early `return` guarded on a missing env var inside a test is a silent
  skip (rust-quality check #33) — it never runs the test's assertions, but
  the suite reports it as a pass. Replace the env-var check with a real
  dependency: `#[sqlx::test]` for a database, `wiremock::MockServer` for an
  external service.
note: >-
  Scoped to functions carrying a `#[test]`/`#[tokio::test]`/`#[*::test]`
  attribute so a legitimate production feature-flag guard (e.g. `if
  env::var("ENABLE_X").is_err() { return; }` in non-test code) is not
  flagged. See .claude/skills/rust-quality/prompts/33-no-skipped-tests.md.
rule:
  kind: if_expression
  inside:
    kind: function_item
    stopBy: end
    follows:
      kind: attribute_item
      stopBy: neighbor
      has:
        kind: attribute
        has:
          any:
            - kind: identifier
              regex: ^test$
            - kind: scoped_identifier
              has:
                field: name
                regex: ^test$
  all:
    - has:
        field: condition
        any:
          - pattern: env::var($ARG).is_err()
          - pattern: std::env::var($ARG).is_err()
    - has:
        field: consequence
        has:
          kind: return_expression
          stopBy: end
