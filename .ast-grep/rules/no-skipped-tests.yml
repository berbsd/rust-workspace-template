# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-skipped-tests
language: Rust
severity: error
message: >-
  `#[ignore]` is banned in this workspace (rust-quality check #33). Convert to
  `#[sqlx::test(migrations = "./migrations")]` for a database dependency, a
  `wiremock::MockServer` for a service dependency, or delete the test with a
  reason in the commit message.
note: >-
  The only exemption is a doctest that genuinely cannot execute — prefer
  ` ```no_run ` there, which still type-checks. See
  .claude/skills/rust-quality/prompts/33-no-skipped-tests.md for the full
  conversion table and rationale.
rule:
  any:
    - pattern: "#[ignore]"
    - pattern: "#[ignore = $REASON]"
