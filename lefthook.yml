# =============================================================================
# Lefthook Configuration
# =============================================================================
# Git hooks manager - runs tools before commit and on commit messages.
# Documentation: https://github.com/evilmartians/lefthook
#
# Hooks configured:
#   pre-commit:  Runs betterleaks, typos, ast-grep, rust-quality-dylint,
#                rustfmt, and squawk on staged files
#   commit-msg:  Runs cogitto (cog) to enforce conventional commits
#
# Usage:
#   lefthook install    # Install hooks (run once after clone)
#   lefthook run pre-commit   # Manually trigger pre-commit hooks
#   lefthook run commit-msg   # Manually trigger commit-msg hooks
# =============================================================================

output:
  - summary
  - failure

pre-commit:
  # piped, not parallel. parallel would be unsafe here: `rustfmt` rewrites the
  # staged files and `stage_fixed: true` git-adds them, so concurrent commands
  # would race on the file contents and on .git/index.lock.
  #
  # piped also stops at the first failure, which parallel and plain sequential
  # do not, so ordering matters: a slow check placed first wastes time on
  # every commit that would have failed a cheap check anyway.
  #
  # priority is mandatory with piped: lefthook orders alphabetically
  # otherwise, which can put an expensive check ahead of a cheap one for no
  # reason. Ordered by cost, cheapest first: typos, betterleaks, ast-grep
  # (structural pattern match, no compilation), rust-quality-dylint (the one
  # command here that invokes the compiler — a `cargo dylint` cache miss is
  # the slowest thing in this list, so it runs last among the Rust-specific
  # checks, right before the two that mutate/scope by file type anyway),
  # rustfmt, squawk.
  piped: true
  commands:
    betterleaks:
      priority: 2
      run: betterleaks git . --staged --no-banner --redact
    typos:
      priority: 1
      glob: "*"
      # Passing paths explicitly makes typos ignore `extend-exclude` in
      # `.typos.toml`, so binary fixtures have to be excluded here too — it
      # reads their compressed bytes as text and reports thousands of false
      # positives.
      exclude:
        # Skill/prompt files quote serde's module paths verbatim, and typos
        # reads those short module names as misspelt English words. Already
        # excluded in `.typos.toml`; mirrored here because that file's
        # `extend-exclude` is ignored when paths are passed explicitly.
        - ".claude/**"
      run: typos {staged_files}
    ast-grep:
      priority: 3
      glob: "*.rs"
      # Structural rules under .ast-grep/rules/ — see .ast-grep/README.md.
      # Passing {staged_files} (not a hardcoded dir list) keeps this scoped
      # to what's actually being committed, same as typos/rustfmt above.
      run: ast-grep scan -c .ast-grep/sgconfig.yml {staged_files}
    rust-quality-dylint:
      priority: 4
      glob: "*.rs"
      # .lints/rust-quality-dylint/ — a separate Cargo workspace (own pinned
      # nightly; see its README for why). --path/--pattern point at it
      # without needing any [workspace.metadata.dylint] entry in the root
      # Cargo.toml. Checks whole packages, not just staged files — `cargo
      # dylint` has no staged-file scoping — so the glob above only controls
      # whether this command runs at all, not what it checks.
      run: cargo dylint --all --path .lints/rust-quality-dylint --pattern '*'
    rustfmt:
      priority: 5
      glob: "*.rs"
      # `rustfmt` on the staged files, not `cargo fmt` on the workspace.
      # `cargo fmt` takes no file scope: it reformats every dirty `.rs` file in
      # the tree, and `stage_fixed` then adds them all — so a commit touching
      # one file could absorb another session's uncommitted Rust work, with a
      # message describing none of it — exactly what staged-file scoping
      # avoids.
      #
      # Edition is passed explicitly because rustfmt invoked directly gets no
      # Cargo manifest to read it from and would otherwise assume 2015.
      # `.rustfmt.toml` is still found by walking up from each file, and the
      # nightly toolchain is still required by the unstable options in it.
      run: rustfmt +nightly --edition 2024 {staged_files}
      stage_fixed: true
    squawk:
      priority: 6
      glob: "*.sql"
      run: npx squawk {staged_files}

commit-msg:
  # piped, not parallel: cheaper structural check (cog verify) first, so a
  # malformed type/scope reports before spending time on the line-length
  # scan.
  piped: true
  commands:
    conventional-commit:
      priority: 1
      run: cog verify "$(cat {1})"
    line-length:
      # cog.toml has no config surface for subject/body line length — see
      # bin/check-commit-message's own header comment — so this is a
      # separate check, not a cog.toml option.
      priority: 2
      run: bin/check-commit-message {1}
