[workspace]
resolver = "2"
members = ["swallowed_errors"]

# Tells `cargo dylint` (run from this directory) where to find lint library
# crates. This is a *separate* namespace from `[workspace.members]` above —
# it does not pull these crates into the root workspace's Cargo build.
[workspace.metadata.dylint]
libraries = [{ path = "swallowed_errors" }]

# Zero-panic policy, mirroring the root workspace's `[workspace.lints.clippy]`
# (see its "Critical Safety (No Panics)" section) — if anything, this matters
# more here: a panic inside a lint pass crashes `cargo check`/`cargo dylint`
# for whichever workspace is being linted, not just this crate's own tests.
[workspace.lints.clippy]
expect_used      = "deny"
indexing_slicing = "warn"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
unwrap_used      = "deny"
