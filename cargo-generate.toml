# =============================================================================
# cargo-generate template configuration
# =============================================================================
# Declares the values a new workspace needs and how generation adapts to
# them. create-rust-workspace's scaffold wrapper collects these from the user
# and passes them non-interactively via `cargo generate --silent -d KEY=value`.
#
# Placeholder names deliberately match the SCREAMING_SNAKE_CASE tokens this
# template's files already use (e.g. {{PROJECT_NAME}}) — cargo-generate's
# Liquid substitution has no lowercase/snake_case requirement, so keeping the
# existing names avoids a repo-wide rename.
# =============================================================================

[template]
# These use their own, unrelated `{{...}}` template syntax (create-rust-service
# substitutes feature-name tokens when scaffolding a service *after* this
# workspace already exists; git-cliff's .cliff.toml uses Tera). `exclude`
# copies them verbatim instead of running them through Liquid — several of
# create-rust-service's prompt files fail to parse as Liquid outright, and
# the rest would silently render blank on every `{{feature_plural}}`-style
# token, since those aren't declared placeholders here.
exclude = [".claude/skills/create-rust-service/**", ".cliff.toml"]
# The repo's own README documents the template for GitHub browsers, not the
# generated project — dropped here, then hooks/post.rhai renames
# README.project.md into its place.
#
# CHANGELOG.md is this repo's own release history (git-cliff output from
# this repo's commits) — meaningless in a fresh project. .cliff.toml (see
# `exclude` above) still ships, so the generated project's own `bin/release`
# generates its own CHANGELOG.md from scratch on its first release.
#
# hooks/ (this file's own [hooks].post script) is a cargo-generate control
# file, not something a generated project needs — verified empirically that
# ignoring it doesn't stop cargo-generate from running it (ignore only
# affects what's copied to the final destination, not what the hook
# mechanism reads from the template source during generation).
#
# .worktrees/** is this repo's own local git-worktree directory (gitignored,
# never present in a real `--git` clone) — ignored so `cargo generate --path`
# against a live checkout that happens to have one doesn't walk into
# unrelated in-progress work and choke on whatever Liquid-unfriendly content
# it contains. Purely a `--path`/local-testing concern; harmless otherwise.
ignore = ["README.md", "CHANGELOG.md", "hooks/**", ".worktrees/**"]

[placeholders]
PROJECT_NAME = { type = "string", prompt = "Project display name (e.g. \"Acme Platform\")" }
AUTHOR_NAME = { type = "string", prompt = "Author name" }
AUTHOR_EMAIL = { type = "string", prompt = "Author email", regex = "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
# A single SPDX id ("MIT", "AGPL-3.0", ...) or an "A OR B" dual/multi
# expression ("MIT OR Apache-2.0"). hooks/post.rhai fetches each part's real
# license text from GitHub's Licenses API (github.com/licenses — the same
# source GitHub's own "choose a license" UI uses) rather than this template
# bundling every possible SPDX license text itself, which wouldn't scale
# and would go stale if any text were ever corrected upstream. Any id
# GitHub's API doesn't recognize — including "UNLICENSED", npm's proprietary
# marker, which isn't a real SPDX id — drops the LICENSE file for that part
# rather than ship one that contradicts this value, printing a note instead
# of failing generation. The regex only guards against shell-metacharacter
# injection (this value flows into a shell command in the hook); it isn't
# an enum, so any real or made-up SPDX-shaped id is accepted here and
# handled at fetch time.
LICENSE = { type = "string", prompt = "License (e.g. \"MIT\", \"Apache-2.0\", \"AGPL-3.0\", \"MIT OR Apache-2.0\", \"UNLICENSED\")", regex = "^[A-Za-z0-9.-]+( OR [A-Za-z0-9.-]+)*$" }
REPO_URL = { type = "string", prompt = "Repository URL" }
METRIC_NAMESPACE = { type = "string", prompt = "Metrics namespace" }
# Strictly X.Y.Z: a floating channel (`stable`/`nightly`) would defeat the
# reproducibility rust-toolchain.toml exists for — see that file's own header
# comment. This regex enforces the same rule scaffold.sh used to enforce in
# the wrapper script; now it's enforced at generation time instead.
RUST_VERSION = { type = "string", prompt = "Rust toolchain version (X.Y.Z)", regex = "^[0-9]+\\.[0-9]+\\.[0-9]+$" }

[hooks]
post = ["hooks/post.rhai"]
